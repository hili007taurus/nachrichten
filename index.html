<!doctype html>
<html lang="de">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trier News">
    <link rel="apple-touch-icon" href="https://lokalo.de">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Trier – Uhr & Nachrichten</title>
    <style>
        html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
        body{background:#f3f3f3;color:#111;overflow:hidden}
        main{box-sizing:border-box;width:100%;height:100%;padding:1.5vh 3vw;display:flex;flex-direction:column}
        #clock{text-align:center;font-size:9vw;line-height:.88;font-weight:700;letter-spacing:-.03em}
        #date{text-align:center;font-size:6vw;margin:.8vh 0 1.2vh;font-weight:600}
        h1{text-align:center;font-size:2.2vw;margin:0 0 0.5vh}
        #newsbox{flex:1;min-height:0;background:#fff;border-radius:12px;overflow-y:auto;padding:15px;box-shadow:inset 0 2px 5px rgba(0,0,0,0.05)}
        .news-item{padding:12px 0;border-bottom:1px solid #eee;font-size:2.5vw;line-height:1.4}
        .news-item:last-child{border-bottom:none}
        .news-time{font-size:1.8vw;color:#777;margin-bottom:3px;font-weight:bold}
        .news-title{font-weight:600;color:#000;text-decoration:none}
        #hint{text-align:center;font-size:1.5vw;margin:.5vh 0 0;opacity:.6}
        body.night{background:#101010;color:#eee}
        body.night #newsbox{background:#1c1c1c}
        body.night .news-item{border-bottom-color:#333}
        body.night .news-title{color:#fff}
        body.night .news-time{color:#aaa}
    </style>
</head>
<body>
    <main>
        <div id="clock">--:--</div>
        <div id="date">--</div>
        <h1>NEUES AUS TRIER &amp; REGION</h1>
        <div id="newsbox">Lade aktuelle Nachrichten...</div>
        <div id="hint">Aktualisierung der Nachrichten alle 15 Minuten</div>
    </main>
    <script>
        function update(){
            const n=new Date(),h=n.getHours();
            document.getElementById('clock').textContent=n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
            document.getElementById('date').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
            document.body.className=(h>=22||h<7)?'night':''
        }

        function reloadNews(){
            const newsbox = document.getElementById('newsbox');
            // Nutzt einen stabilen, alternativen CORS-Proxy für die Tagesschau-Meldungen
            const rssUrl = 'https://tagesschau.de'; 
            const apiUrl = `https://allorigins.win{encodeURIComponent(rssUrl)}`;

            fetch(apiUrl)
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Netzwerk-Fehler');
                })
                .then(data => {
                    // XML Text parsen
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                    const items = xmlDoc.getElementsByTagName("item");
                    
                    newsbox.innerHTML = '';
                    
                    // Die ersten 15 Nachrichten anzeigen
                    for (let i = 0; i < Math.min(items.length, 15); i++) {
                        const title = items[i].getElementsByTagName("title")[0].textContent;
                        let pubDate = items[i].getElementsByTagName("pubDate")[0].textContent;
                        
                        const date = new Date(pubDate);
                        const timeStr = date.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'}) + ' Uhr';
                        
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'news-item';
                        itemDiv.innerHTML = `
                            <div class="news-time">${timeStr}</div>
                            <div class="news-title">${title}</div>
                        `;
                        newsbox.appendChild(itemDiv);
                    }
                })
                .catch(e => {
                    newsbox.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.5;">Nachrichten konnten nicht geladen werden. Bitte Seite neu laden.</div>';
                });
        }

        update();
        reloadNews();
        setInterval(update,1000);
        setInterval(reloadNews,900000);
    </script>
</body>
</html>
